<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e31b23">
<title>Offline — Branch</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, sans-serif; background: #fff; color: #1a1a1a; display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
  p { color: #555; margin: 0 0 20px; }
  button { background: #e31b23; color: #fff; border: 0; padding: 12px 20px; font: 700 14px system-ui; text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>The app needs the internet to show the latest. Pages you opened recently still work.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
